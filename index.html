<script>
const products=[{"name": "WSH-605", "h": 24.0, "w": 14.0, "v": 0.058656, "pack": 1}, {"name": "WSH-805", "h": 24.0, "w": 20.2, "v": 0.058656, "pack": 1}, {"name": "CSH-801", "h": 24.0, "w": 9.45, "v": 0.058656, "pack": 1}, {"name": "GSH-630", "h": 24.0, "w": 13.8, "v": 0.058656, "pack": 1}, {"name": "GSH-801", "h": 28.0, "w": 18.9, "v": 0.081536, "pack": 1}, {"name": "ZGZ-801 1 sztuka", "h": 127.0, "w": 39.5, "v": 0.256032, "pack": 1}, {"name": "ZGB-401 2 sztuki", "h": 45.0, "w": 23.2, "v": 0.10962, "pack": 2}, {"name": "R10", "h": 15.0, "w": 0.8, "v": 0.00675, "pack": 1}, {"name": "NB1", "h": 15.0, "w": 2.1, "v": 0.009, "pack": 1}, {"name": "KG-25-01", "h": 7.0, "w": 1.05, "v": 0.0046305, "pack": 1}, {"name": "KG-25-02", "h": 7.0, "w": 1.35, "v": 0.0046305, "pack": 1}, {"name": "KG-40-01", "h": 8.0, "w": 1.9, "v": 0.008262, "pack": 1}, {"name": "KG-40-02", "h": 8.0, "w": 2.4, "v": 0.008262, "pack": 1}, {"name": "DSH-805", "h": 16.0, "w": 8.0, "v": 0.039104, "pack": 1}, {"name": "ZGZ-802 1 sztuka", "h": 127.0, "w": 48, "v": 0.256032, "pack": 1}, {"name": "ZGB-601 1 sztuka", "h": 137.0, "w": 27.25, "v": 0.2466, "pack": 1}, {"name": "WT-1", "h": 0.5, "w": 0.5, "v": 0.0005445, "pack": 1}, {"name": "WT-2", "h": 1.0, "w": 0.65, "v": 0.001089, "pack": 1}, {"name": "ZGZ 1 pc", "h": 127.0, "w": 39.5, "v": 0, "pack": 1}, {"name": "ZGB 2 pcs", "h": 45.0, "w": 23.2, "v": 0, "pack": 1}];
const palletH={"EURO":15,"PÓŁPALETA":13,"DECHA":14};

function opts(){return products.map(p=>`<option>${p.name}</option>`).join('')}

function addPallet(){
 const nr=document.querySelectorAll('.pallet').length+1;
 const d=document.createElement('div');
 d.className='pallet';
 d.innerHTML=`<h2>Paleta ${nr}</h2>
 <select class='ptype'><option>EURO</option><option>PÓŁPALETA</option><option>DECHA</option></select>
 <button class='red noprint' onclick='this.parentNode.remove();calc()'>Usuń paletę</button>
 <table><tr><th>Produkt</th><th>Ilość</th><th>Uwagi</th><th></th></tr><tbody></tbody></table>
 <button class='green noprint' onclick='addProd(this)'>Dodaj produkt</button>
 <div class='sum'></div>`;
 pallets.appendChild(d);
 addProd(d.querySelector('.green'));
 calc();
}

function addProd(btn){
 let tr=document.createElement('tr');
 tr.innerHTML=`<td><select class='prod'>${opts()}</select></td>
 <td><input type='number' class='qty' value='1' min='1'></td>
 <td><input class='note'></td>
 <td><button class='red noprint' onclick='this.closest("tr").remove();calc()'>Usuń</button></td>`;
 btn.parentNode.querySelector('tbody').appendChild(tr);
}

function calc(){
 let TW=0,TV=0,TH=0;
 document.querySelectorAll('.pallet').forEach((pal,i)=>{
  let pw=0,pv=0,maxProdHeight=0;
  pal.querySelectorAll('tbody tr').forEach(r=>{
    let p=products.find(x=>x.name===r.querySelector('.prod').value);
    let q=parseInt(r.querySelector('.qty').value||0);
    let cartons=Math.ceil(q/p.pack);
    let layers=Math.ceil(cartons/2); // 2 kartony na warstwę
    let prodHeight=layers*p.h;

    if(prodHeight>maxProdHeight) maxProdHeight=prodHeight;
    pw += p.w*cartons;
    pv += p.v*q;
  });

  let finalHeight=maxProdHeight + palletH[pal.querySelector('.ptype').value];
  TW+=pw; TV+=pv; if(finalHeight>TH) TH=finalHeight;

  pal.querySelector('.sum').innerHTML=
   `<b>Paleta ${i+1}</b> | Waga: ${pw.toFixed(1)} kg | Kubatura: ${pv.toFixed(3)} m³ | Wysokość: ${finalHeight.toFixed(0)} cm`;
 });
 tw.innerText=TW.toFixed(1)+' kg';
 tv.innerText=TV.toFixed(3)+' m³';
 th.innerText=TH.toFixed(0)+' cm';
 tp.innerText=document.querySelectorAll('.pallet').length;
}
